[project]
name = "slid"
version = "0.1.0"
description = "Distilling an offline language-ID teacher into a streaming student"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "soundfile",
    "huggingface_hub",
    "matplotlib",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slid"]
